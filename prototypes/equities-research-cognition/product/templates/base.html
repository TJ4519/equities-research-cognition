<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Research jobs{% endblock %}</title>
  <style>
    :root{color-scheme:light;--ink:#17211d;--muted:#59645f;--paper:#f5f3ed;--card:#fff;--line:#d8d8cf;--accent:#176b55;--soft:#e4f1eb;--warn:#8c4b16}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif}
    header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.82)}
    .bar,main{width:min(940px,calc(100% - 32px));margin:auto}.bar{height:64px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:750;letter-spacing:-.02em}.session{font-size:.85rem;color:var(--muted)}nav{display:flex;gap:16px;align-items:center}
    main{padding:48px 0 72px}
    h1{font:650 clamp(2rem,5vw,3.4rem)/1.05 ui-serif,Georgia,serif;letter-spacing:-.035em;max-width:18ch;margin:.35rem 0 1rem}
    h2{font:650 1.25rem/1.25 ui-serif,Georgia,serif;margin:0 0 .65rem} p{margin:.4rem 0 1rem}.muted{color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 8px 28px rgba(23,33,29,.045)}
    .meta{display:grid;grid-template-columns:150px 1fr;gap:10px 18px}.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:600}
    blockquote{margin:18px 0;padding:18px 20px;border-left:4px solid var(--accent);background:var(--soft);font:600 1.12rem/1.55 ui-serif,Georgia,serif}
    .rubric,.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rubric article{border:1px solid var(--line);border-radius:10px;padding:16px}.rubric h3{margin:0 0 4px;text-transform:capitalize;font-size:1rem}.rubric p{margin:0;color:var(--muted);font-size:.92rem}
    .badge{display:inline-block;border:1px solid #d4b69a;color:var(--warn);background:#fff8ef;border-radius:99px;padding:5px 10px;font-size:.75rem;font-weight:750}
    a{color:var(--accent)}.case-link{display:block;text-decoration:none;color:inherit}.case-link:hover{border-color:var(--accent)}
    label{display:block;font-weight:650;margin:16px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:white}.choice{display:flex;gap:9px;align-items:center}.choice input{width:auto}button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:white;font-weight:750;cursor:pointer}.centered-submit{text-align:center}
    .record{border-top:1px solid var(--line);padding:14px 0}.record summary{cursor:pointer}.record pre,pre{white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto;background:#f6f7f5;padding:14px;border-radius:8px;font-size:.78rem}
    .split,.section-title,.action-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.action-row{align-items:center}.action-row form{margin:0}.action-row button{margin-top:0}.secondary{background:#59645f}.status{font-size:.78rem;color:var(--muted)}.good{color:var(--accent);font-weight:700}.warn{color:var(--warn)}.mono{font: .78rem/1.45 ui-monospace,SFMono-Regular,monospace;word-break:break-all}.preserve{white-space:pre-wrap}
    .login{max-width:440px;margin:32px auto}@media(max-width:650px){.rubric,.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.bar{height:56px}main{padding-top:32px}}
  </style>
</head>
<body>
<header><div class="bar"><div class="brand">Research work</div>{% if user.is_authenticated %}<nav><a href="{% url 'campaigns' %}">Jobs</a><a href="{% url 'queue' %}">Review queue</a><span class="session">{{ user.username }}</span></nav>{% endif %}</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
